name: Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update"
        required: true
        type: string
      portable_seed_tag:
        description: "Optional previous release tag used as portable seed"
        required: false
        type: string
      phone_agent_apk_url:
        description: "Optional AgentPhone_latest.apk download URL"
        required: false
        type: string
      phone_agent_version:
        description: "Optional phone agent versionName, for example 6.60"
        required: false
        type: string
      phone_agent_version_code:
        description: "Optional phone agent versionCode, for example 930"
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    name: Windows release build
    runs-on: windows-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/loom-platform/openclaw_new_launcher/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install release signing dependency
        run: python -m pip install "cryptography>=42,<47"

      - name: Setup Rust
        run: |
          rustup default stable
          rustup show

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/loom-platform/openclaw_new_launcher/src-tauri/target
          key: ${{ runner.os }}-cargo-platform-release-${{ hashFiles('apps/loom-platform/openclaw_new_launcher/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-platform-release-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: apps/loom-platform/openclaw_new_launcher
        run: npm ci

      - name: Verify source text
        working-directory: apps/loom-platform
        run: powershell -ExecutionPolicy Bypass -File scripts\verify-source-text.ps1

      - name: Verify source secrets
        working-directory: apps/loom-platform
        run: powershell -ExecutionPolicy Bypass -File scripts\verify-release-secrets.ps1 -Source

      - name: Verify version consistency
        working-directory: apps/loom-platform
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: powershell -ExecutionPolicy Bypass -File scripts\verify-version-consistency.ps1 -TagName $env:RELEASE_TAG

      - name: Build and verify bundled Skill library
        run: |
          $buildOutput = @(
            & powershell -NoProfile -ExecutionPolicy Bypass `
              -File apps\loom-platform\scripts\build-luming-skills-library.ps1
          )
          if ($LASTEXITCODE -ne 0) {
            throw "Skill Library build failed with exit code $LASTEXITCODE"
          }
          $build = ($buildOutput | Select-Object -Last 1) | ConvertFrom-Json
          & powershell -NoProfile -ExecutionPolicy Bypass `
            -File apps\loom-platform\scripts\build-luming-skills-library.ps1 `
            -VerifyOnly `
            -SkipValidation | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Skill Library verification failed with exit code $LASTEXITCODE"
          }
          $archive = (
            Resolve-Path -LiteralPath (
              Join-Path "apps\loom-platform\openclaw_new_launcher\public\skills" ([string]$build.archive)
            )
          ).Path
          "LOOM_SKILL_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LOOM_SKILL_SHA256=$([string]$build.sha256)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build frontend
        working-directory: apps/loom-platform/openclaw_new_launcher
        run: npm run build

      - name: Build bundled Python runtime
        working-directory: apps/loom-platform/openclaw_new_launcher
        run: npm run build:python-runtime

      - name: Build bundled Node runtime
        working-directory: apps/loom-platform/openclaw_new_launcher
        run: npm run build:node-runtime

      - name: Check Rust
        working-directory: apps/loom-platform/openclaw_new_launcher/src-tauri
        run: cargo check

      - name: Import Windows code-signing certificate
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64) -and [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) {
            Write-Warning "Windows Authenticode certificate is not configured. The release will use the required LOOM Ed25519 signature."
            "WINDOWS_CERTIFICATE_THUMBPRINT=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            return
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) {
            throw "WINDOWS_PFX_BASE64 and WINDOWS_PFX_PASSWORD must either both be configured or both be empty."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "loom-code-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item -LiteralPath $pfxPath -Force
          if (-not $certificate -or -not $certificate.HasPrivateKey) {
            throw "Imported Windows code-signing certificate has no private key."
          }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build protected NSIS
        working-directory: apps/loom-platform/openclaw_new_launcher
        run: |
          # Canonical bundle root: apps/loom-platform/openclaw_new_launcher/src-tauri/target/release/bundle
          npm run package:protected:nsis
          if ($LASTEXITCODE -ne 0) {
            throw "Protected NSIS build failed with exit code $LASTEXITCODE"
          }

          $version = node -p "require('./package.json').version"
          $bundleDir = Join-Path $PWD "src-tauri\target\release\bundle\nsis"
          $builtInstaller = Get-ChildItem -LiteralPath $bundleDir -File -Filter "*$version*_x64-setup.exe" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $builtInstaller) {
            throw "Protected NSIS output is missing under $bundleDir"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
            $certificate = Get-Item -LiteralPath "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT"
            $signature = Set-AuthenticodeSignature `
              -FilePath $builtInstaller.FullName `
              -Certificate $certificate `
              -HashAlgorithm SHA256 `
              -TimestampServer "http://timestamp.digicert.com"
            if ($signature.Status -ne "Valid") {
              throw "Protected NSIS signature is not valid: $($signature.Status) $($signature.StatusMessage)"
            }
          }

          "LOOM_BUILT_INSTALLER=$($builtInstaller.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LOOM_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign desktop update manifest
        working-directory: apps/loom-platform/openclaw_new_launcher
        env:
          LOOM_DESKTOP_UPDATE_PRIVATE_KEY: ${{ secrets.LOOM_DESKTOP_UPDATE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LOOM_DESKTOP_UPDATE_PRIVATE_KEY)) {
            throw "LOOM_DESKTOP_UPDATE_PRIVATE_KEY is required for desktop auto-update releases."
          }
          $outputRoot = Join-Path (Split-Path -Parent $PWD) "ci_release_nsis"
          $mirrorBaseUrl = "https://gitee.com/rfdiosuao/lumi/releases/download/$env:RELEASE_TAG"
          $githubPartsBaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          $githubInstallerUrl = "$githubPartsBaseUrl/LOOM-$env:LOOM_RELEASE_VERSION-setup.exe"
          & powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts\prepare-desktop-update-release.ps1 `
            -InstallerPath $env:LOOM_BUILT_INSTALLER `
            -Version $env:LOOM_RELEASE_VERSION `
            -OutputDirectory $outputRoot `
            -DownloadUrl $githubInstallerUrl `
            -MirrorBaseUrl $mirrorBaseUrl `
            -MirrorFallbackBaseUrl $githubPartsBaseUrl
          if ($LASTEXITCODE -ne 0) {
            throw "Desktop update release preparation failed with exit code $LASTEXITCODE"
          }

      - name: Smoke-test the exact complete installer
        working-directory: apps/loom-platform
        run: |
          $version = node -p "require('./openclaw_new_launcher/package.json').version"
          $installer = Join-Path $PWD "ci_release_nsis\LOOM-$version-setup.exe"
          $smokeRoot = Join-Path $PWD "artifacts\ci-nsis-smoke"
          $chineseUser = ([string][char]0x4E2D) + ([char]0x6587) + ([char]0x7528) + ([char]0x6237)
          $luming = ([string][char]0x9E93) + ([char]0x9E23)
          $paths = @(
            (Join-Path $smokeRoot "ascii\LOOM"),
            (Join-Path $smokeRoot "$chineseUser\$luming")
          )
          & .\scripts\smoke-test-tauri-nsis.ps1 `
            -Installer $installer `
            -SmokeRoot $smokeRoot `
            -InstallPaths $paths

      - name: Prepare portable seed
        working-directory: apps/loom-platform
        env:
          GH_TOKEN: ${{ github.token }}
          PORTABLE_SEED_TAG: ${{ inputs.portable_seed_tag || '' }}
        run: |
          $seedRoot = Join-Path $PWD "ci_seed"
          $downloadDir = Join-Path $seedRoot "download"
          $extractDir = Join-Path $seedRoot "extract"
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null

          $downloadArgs = @("release", "download", "--repo", $env:GITHUB_REPOSITORY, "--pattern", "*Portable-*.zip", "--dir", $downloadDir)
          if (-not [string]::IsNullOrWhiteSpace($env:PORTABLE_SEED_TAG)) {
            $downloadArgs = @("release", "download", $env:PORTABLE_SEED_TAG, "--repo", $env:GITHUB_REPOSITORY, "--pattern", "*Portable-*.zip", "--dir", $downloadDir)
          }

          gh @downloadArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Unable to download previous portable seed. The portable build will bootstrap runtime dependencies instead."
            "PORTABLE_SEED_DIR=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            return
          }

          $seedZip = Get-ChildItem -LiteralPath $downloadDir -File -Filter "*Portable-*.zip" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $seedZip) {
            Write-Warning "No portable seed was downloaded. The portable build will bootstrap runtime dependencies instead."
            "PORTABLE_SEED_DIR=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            return
          }

          Expand-Archive -LiteralPath $seedZip.FullName -DestinationPath $extractDir -Force

          $seedCandidates = @()
          $seedCandidates += Get-ChildItem -LiteralPath $extractDir -Directory -ErrorAction SilentlyContinue
          $seedCandidates += Get-Item -LiteralPath $extractDir
          $seedDir = $seedCandidates |
            Where-Object {
              (Test-Path -LiteralPath (Join-Path $_.FullName "LOOM.exe")) -or
              (Test-Path -LiteralPath (Join-Path $_.FullName "LOOMFiles")) -or
              (Test-Path -LiteralPath (Join-Path $_.FullName "OpenClaw.exe")) -or
              (Test-Path -LiteralPath (Join-Path $_.FullName "OpenClawFiles")) -or
              (Test-Path -LiteralPath (Join-Path $_.FullName "node\node.exe"))
            } |
            Select-Object -First 1

          if (-not $seedDir) {
            Write-Warning "Downloaded seed zip does not look like a LOOM portable package: $($seedZip.FullName). The portable build will bootstrap runtime dependencies instead."
            "PORTABLE_SEED_DIR=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            return
          }

          "PORTABLE_SEED_DIR=$($seedDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download WebView2 runtime for portable package
        working-directory: apps/loom-platform
        run: |
          $runtimePath = Join-Path $PWD "openclaw_new_launcher\redist\MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              & .\scripts\download-webview2-runtime.ps1
              if (-not (Test-Path -LiteralPath $runtimePath -PathType Leaf)) {
                throw "WebView2 runtime download did not create $runtimePath"
              }
              if ((Get-Item -LiteralPath $runtimePath).Length -lt 1MB) {
                throw "Downloaded WebView2 runtime is smaller than 1 MB."
              }
              break
            } catch {
              if ($attempt -eq $maxAttempts) {
                throw
              }
              Write-Warning "WebView2 runtime download attempt $attempt failed. Retrying..."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }

      - name: Build portable package
        working-directory: apps/loom-platform
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          PHONE_AGENT_VERSION: ${{ inputs.phone_agent_version || vars.PHONE_AGENT_VERSION || '' }}
          PHONE_AGENT_VERSION_CODE: ${{ inputs.phone_agent_version_code || vars.PHONE_AGENT_VERSION_CODE || '0' }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag -replace '^v', ''
          $date = Get-Date -Format "yyyy.MM.dd"
          $packageName = "LOOM-Portable-$tag-$date"

          $args = @(
            "-ExecutionPolicy", "Bypass",
            "-File", "scripts\build-portable.ps1",
            "-Version", $version,
            "-PackageName", $packageName,
            "-SeedPortableDir", $env:PORTABLE_SEED_DIR,
            "-BrandProfile", "lumi",
            "-SkipBuild"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:PHONE_AGENT_VERSION)) {
            $args += @("-PhoneAgentVerifiedVersion", $env:PHONE_AGENT_VERSION)
          }
          if (-not [string]::IsNullOrWhiteSpace($env:PHONE_AGENT_VERSION_CODE) -and $env:PHONE_AGENT_VERSION_CODE -ne "0") {
            $args += @("-PhoneAgentVerifiedVersionCode", $env:PHONE_AGENT_VERSION_CODE)
          }

          & powershell @args

      - name: Collect release assets
        working-directory: apps/loom-platform
        run: |
          $artifactDir = Join-Path $PWD "ci_artifacts"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $version = node -p "require('./openclaw_new_launcher/package.json').version"
          $setupPath = Join-Path $PWD "ci_release_nsis\LOOM-$version-setup.exe"
          $setupHashPath = "$setupPath.sha256.txt"
          $setupUpdateManifest = "$setupPath.update.json"
          if (
            -not (Test-Path -LiteralPath $setupPath) -or
            -not (Test-Path -LiteralPath $setupHashPath) -or
            -not (Test-Path -LiteralPath $setupUpdateManifest)
          ) {
            throw "Complete NSIS output is missing: $setupPath"
          }
          Copy-Item -LiteralPath $setupPath -Destination (Join-Path $artifactDir "LOOM-$version-setup.exe")
          Copy-Item -LiteralPath $setupHashPath -Destination (Join-Path $artifactDir "LOOM-$version-setup.exe.sha256.txt")
          Copy-Item -LiteralPath $setupUpdateManifest -Destination (Join-Path $artifactDir "LOOM-$version-setup.exe.update.json")
          Copy-Item -LiteralPath $setupUpdateManifest -Destination (Join-Path $artifactDir "LOOM-stable.update.json")
          Get-ChildItem -LiteralPath (Join-Path $PWD "ci_release_nsis\mirror-parts") -File -Filter "LOOM-*-setup.part*" |
            ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $artifactDir $_.Name) -Force
            }

          Get-ChildItem -LiteralPath (Join-Path $PWD "release") -File -Filter "LOOM-Portable-*.zip*" |
            ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $artifactDir $_.Name) -Force
            }

          if (-not (Test-Path -LiteralPath $env:LOOM_SKILL_ARCHIVE -PathType Leaf)) {
            throw "Bundled Skill Library release asset is missing: $env:LOOM_SKILL_ARCHIVE"
          }
          $skillHash = (Get-FileHash -LiteralPath $env:LOOM_SKILL_ARCHIVE -Algorithm SHA256).Hash
          if ($skillHash -cne $env:LOOM_SKILL_SHA256) {
            throw "Bundled Skill Library hash changed before release: $skillHash"
          }
          Copy-Item `
            -LiteralPath $env:LOOM_SKILL_ARCHIVE `
            -Destination (Join-Path $artifactDir (Split-Path -Leaf $env:LOOM_SKILL_ARCHIVE)) `
            -Force

          foreach ($file in (Get-ChildItem -LiteralPath $artifactDir -File | Where-Object { $_.Name -notlike "*.sha256.txt" })) {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName
            "$($hash.Hash)  $($file.Name)" | Set-Content -LiteralPath "$($file.FullName).sha256.txt" -Encoding ASCII
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: platform-release-assets
          path: apps/loom-platform/ci_artifacts/*

      - name: Prepare product release notes
        working-directory: apps/loom-platform
        run: |
          $version = node -p "require('./openclaw_new_launcher/package.json').version"
          $notesPath = Join-Path $PWD "openclaw_new_launcher\docs\RELEASE_NOTES_$version.md"
          $bodyPath = Join-Path $PWD "ci_artifacts\RELEASE_BODY.md"
          $body = if (Test-Path -LiteralPath $notesPath -PathType Leaf) {
            (Get-Content -LiteralPath $notesPath -Raw).Trim()
          } else {
            "# LOOM $version 更新说明`n`n本次版本包含稳定性、兼容性与使用体验改进。"
          }
          [IO.File]::WriteAllText($bodyPath, "$body`n", [Text.UTF8Encoding]::new($false))

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: LOOM ${{ inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body_path: apps/loom-platform/ci_artifacts/RELEASE_BODY.md
          files: |
            apps/loom-platform/ci_artifacts/*.exe
            apps/loom-platform/ci_artifacts/*.zip
            apps/loom-platform/ci_artifacts/*.sha256.txt
            apps/loom-platform/ci_artifacts/*.update.json
            apps/loom-platform/ci_artifacts/*.part???

      - name: Publish signed domestic update mirror
        continue-on-error: false
        timeout-minutes: 35
        working-directory: apps/loom-platform
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITEE_ACCESS_TOKEN)) {
            throw "GITEE_ACCESS_TOKEN is required for the signed domestic update mirror."
          }
          $version = $env:RELEASE_TAG -replace '^v', ''
          $manifestPath = Join-Path $PWD "ci_release_nsis\LOOM-$version-setup.exe.update.json"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Signed domestic update manifest is missing: $manifestPath"
          }
          $partsRoot = Join-Path $PWD "ci_release_nsis\mirror-parts"
          $parts = @(
            Get-ChildItem -LiteralPath $partsRoot -File -Filter "LOOM-*-setup.part*" |
              Sort-Object Name |
              Select-Object -ExpandProperty FullName
          )
          if ($parts.Count -eq 0) {
            throw "No signed domestic update parts were generated."
          }
          foreach ($part in $parts) {
            if ((Get-Item -LiteralPath $part).Length -gt 100MB) {
              throw "Domestic update part exceeds the Gitee 100 MiB attachment limit: $part"
            }
          }
          $publisher = (Resolve-Path -LiteralPath ".\scripts\publish-gitee-release.ps1").Path
          $releaseName = "LOOM $env:RELEASE_TAG 国内更新镜像"
          $releaseBody = "LOOM 桌面自动更新签名分片。请通过 LOOM 更新中心安装，勿单独运行分片。"
          & $publisher `
            -TagName $env:RELEASE_TAG `
            -Name $releaseName `
            -Body $releaseBody `
            -Assets @($manifestPath, $env:LOOM_SKILL_ARCHIVE) `
            -PruneDesktopReleases

          $jobs = @(
            foreach ($part in $parts) {
              Start-Job -ScriptBlock {
                param($Publisher, $TagName, $ReleaseName, $ReleaseBody, $Asset)
                $ErrorActionPreference = "Stop"
                & $Publisher `
                  -TagName $TagName `
                  -Name $ReleaseName `
                  -Body $ReleaseBody `
                  -Assets @($Asset)
              } -ArgumentList $publisher, $env:RELEASE_TAG, $releaseName, $releaseBody, $part
            }
          )
          try {
            $null = Wait-Job -Job $jobs -Timeout 1800
            $unfinished = @($jobs | Where-Object { $_.State -notin @("Completed", "Failed", "Stopped") })
            if ($unfinished.Count -gt 0) {
              $unfinished | Stop-Job
              throw "Domestic mirror uploads exceeded the 30 minute best-effort deadline."
            }
            foreach ($job in $jobs) {
              Receive-Job -Job $job | Write-Host
              if ($job.State -ne "Completed") {
                throw "Domestic mirror upload job failed: $($job.ChildJobs[0].JobStateInfo.Reason)"
              }
            }
          } finally {
            $jobs | Where-Object State -eq "Running" | Stop-Job
            $jobs | Remove-Job -Force
          }

          $expectedAssets = @($manifestPath, $env:LOOM_SKILL_ARCHIVE) + @($parts)
          & $publisher `
            -TagName $env:RELEASE_TAG `
            -Name $releaseName `
            -Body $releaseBody `
            -Assets $expectedAssets `
            -VerifyOnly

      - name: Verify published Skill mirrors
        working-directory: apps/loom-platform
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          $archiveName = Split-Path -Leaf $env:LOOM_SKILL_ARCHIVE
          $urls = @(
            "https://gitee.com/rfdiosuao/lumi/releases/download/$env:RELEASE_TAG/$archiveName",
            "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$archiveName"
          )
          foreach ($url in $urls) {
            $download = Join-Path $env:RUNNER_TEMP ("skill-mirror-" + [Guid]::NewGuid().ToString("N") + ".zip")
            try {
              $lastError = $null
              for ($attempt = 1; $attempt -le 5; $attempt += 1) {
                try {
                  Invoke-WebRequest -Uri $url -OutFile $download -MaximumRedirection 10
                  $lastError = $null
                  break
                } catch {
                  $lastError = $_
                  if ($attempt -lt 5) {
                    Start-Sleep -Seconds (5 * $attempt)
                  }
                }
              }
              if ($null -ne $lastError) {
                throw "Published Skill mirror is unavailable: $url. $($lastError.Exception.Message)"
              }
              $hash = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash
              if ($hash -cne $env:LOOM_SKILL_SHA256) {
                throw "Published Skill mirror hash mismatch: $url returned $hash"
              }
            } finally {
              Remove-Item -LiteralPath $download -Force -ErrorAction SilentlyContinue
            }
          }
